<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="東京23区の業務ドライバー向けに、駐車候補と受取しやすさを安全側に表示するランチMAP MVP。"
    />
    <meta name="theme-color" content="#14362f" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=11" />
    <title>Park Park Lunch</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">P</span>
          <div>
            <h1>Park Park Lunch</h1>
            <p>東京23区 業務ドライバー向けランチMAP</p>
          </div>
        </div>
        <div class="status-pill" id="speedStatus">停車中確認待ち</div>
      </header>

      <main class="workspace">
        <section class="map-pane" aria-label="ランチ候補マップ">
          <div id="map" class="map"></div>
          <div class="map-credit" id="mapCredit">Google Maps / Places API店舗 + OSM駐車補助</div>
        </section>

        <aside class="panel" aria-label="検索条件と候補一覧">
          <form id="searchForm" class="search-panel">
            <div class="location-search">
              <label class="location-field">
                場所
                <input id="locationInput" type="text" autocomplete="off" placeholder="現在地 / 駅名・住所" />
              </label>
              <button id="locateButton" class="secondary-button" type="button">現在地</button>
            </div>
            <div class="compact-controls">
              <div class="choice-field">
                車両
                <input id="vehicleType" type="hidden" value="standard" />
                <div class="chip-group" role="radiogroup" aria-label="車両">
                  <label class="option-chip"><input type="radio" name="vehicleTypeChoice" value="standard" checked />普通車</label>
                  <label class="option-chip"><input type="radio" name="vehicleTypeChoice" value="cargo" />貨物車</label>
                </div>
              </div>
              <label>
                時刻
                <input id="timeInput" type="time" />
              </label>
              <div class="choice-field">
                半径
                <input id="radiusInput" type="hidden" value="2200" />
                <div class="chip-group radius-group" role="radiogroup" aria-label="半径">
                  <label class="option-chip"><input type="radio" name="radiusChoice" value="1200" />1.2km</label>
                  <label class="option-chip"><input type="radio" name="radiusChoice" value="2200" checked />2.2km</label>
                  <label class="option-chip"><input type="radio" name="radiusChoice" value="3500" />3.5km</label>
                  <label class="option-chip"><input type="radio" name="radiusChoice" value="5000" />5km</label>
                </div>
              </div>
            </div>
            <div class="result-controls">
              <div class="choice-field">
                表示
                <input id="resultLimit" type="hidden" value="5" />
                <div class="chip-group" role="radiogroup" aria-label="表示">
                  <label class="option-chip"><input type="radio" name="resultLimitChoice" value="5" checked />5件</label>
                  <label class="option-chip"><input type="radio" name="resultLimitChoice" value="10" />10件</label>
                  <label class="option-chip"><input type="radio" name="resultLimitChoice" value="all" />すべて</label>
                </div>
              </div>
              <div class="choice-field">
                ジャンル
                <input id="genreFilter" type="hidden" value="all" />
                <div class="chip-group genre-group" role="radiogroup" aria-label="ジャンル">
                  <label class="option-chip"><input type="radio" name="genreChoice" value="all" checked />すべて</label>
                  <label class="option-chip"><input type="radio" name="genreChoice" value="convenience" />コンビニ</label>
                  <label class="option-chip"><input type="radio" name="genreChoice" value="fast_food" />ファストフード</label>
                  <label class="option-chip"><input type="radio" name="genreChoice" value="cafe" />カフェ</label>
                  <label class="option-chip"><input type="radio" name="genreChoice" value="deli" />弁当・惣菜</label>
                  <label class="option-chip"><input type="radio" name="genreChoice" value="supermarket" />スーパー</label>
                  <label class="option-chip"><input type="radio" name="genreChoice" value="restaurant" />飲食店</label>
                </div>
              </div>
            </div>
            <button id="searchButton" class="primary-button" type="submit">この場所で探す</button>
          </form>

          <div class="notice">
            ⚠️ 現地標識確認必須。本アプリは駐車許可を保証しません。🅿️ は近くの駐車候補、❔ は駐車未確認です。
          </div>

          <div class="live-status" id="liveStatus" aria-live="polite">条件を設定して「この場所で探す」を押してください。</div>

          <div class="tabs" role="tablist" aria-label="検索結果の種類">
            <button id="safeTab" type="button" class="tab tab-safe active" aria-selected="true">
              停めやすい <span id="safeCount" class="tab-count">0</span>
            </button>
            <button id="cautionTab" type="button" class="tab tab-caution" aria-selected="false">
              駐車未確認 <span id="cautionCount" class="tab-count">0</span>
            </button>
          </div>

          <section id="spotList" class="spot-list" aria-label="ランチ候補"></section>
        </aside>
      </main>

      <div id="driveLock" class="drive-lock hidden" role="alertdialog" aria-modal="true">
        <div class="drive-lock-panel">
          <h2>走行中の操作を停止しています</h2>
          <p>安全な場所で完全に停車してから操作してください。</p>
          <span id="lockSpeed">速度確認中</span>
        </div>
      </div>
    </div>

    <script src="config.js?v=1"></script>
    <script type="module" src="app.js?v=27"></script>
  </body>
</html>
