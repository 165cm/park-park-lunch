<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="東京23区の業務ドライバー向けに、駐車候補と受取しやすさを安全側に表示するランチMAP MVP。"
    />
    <meta name="theme-color" content="#14362f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=2" />
    <title>Park Park Lunch</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">P</span>
          <div>
            <h1>Park Park Lunch</h1>
            <p>東京23区 業務ドライバー向けランチMAP</p>
          </div>
        </div>
        <div class="status-pill" id="speedStatus">停車中確認待ち</div>
      </header>

      <main class="workspace">
        <section class="map-pane" aria-label="ランチ候補マップ">
          <div id="map" class="map"></div>
          <div class="map-credit" id="mapCredit">Google Maps / OSMライブ検索</div>
          <div class="map-actions">
            <button id="locateButton" class="tool-button" type="button">現在地</button>
            <button id="tapModeButton" class="tool-button" type="button" aria-pressed="false">地図タップ</button>
          </div>
        </section>

        <aside class="panel" aria-label="検索条件と候補一覧">
          <form id="searchForm" class="search-panel">
            <label>
              地点入力
              <input id="locationInput" type="text" autocomplete="off" placeholder="東京駅 / 35.681,139.767" />
            </label>
            <div class="field-row">
              <label>
                車両
                <select id="vehicleType">
                  <option value="standard">普通車</option>
                  <option value="cargo">貨物車</option>
                </select>
              </label>
              <label>
                時刻
                <input id="timeInput" type="time" />
              </label>
            </div>
            <label>
              半径
              <select id="radiusInput">
                <option value="1200">1.2km</option>
                <option value="2200" selected>2.2km</option>
                <option value="3500">3.5km</option>
                <option value="5000">5km</option>
              </select>
            </label>
            <button class="primary-button" type="submit">候補を更新</button>
          </form>

          <div class="notice">
            現地標識確認必須。本アプリは駐車許可を保証しません。車を離れる場合は推奨された駐車施設を利用してください。
          </div>

          <section class="summary" aria-live="polite">
            <div>
              <span class="summary-number" id="safeCount">0</span>
              <span>推奨候補</span>
            </div>
            <div>
              <span class="summary-number" id="cautionCount">0</span>
              <span>注意候補</span>
            </div>
          </section>
          <div class="live-status" id="liveStatus">検索データ確認中</div>

          <div class="tabs" role="tablist" aria-label="候補タイプ">
            <button id="safeTab" type="button" class="tab active" aria-selected="true">推奨</button>
            <button id="cautionTab" type="button" class="tab" aria-selected="false">注意</button>
          </div>

          <section id="spotList" class="spot-list" aria-label="ランチ候補"></section>
        </aside>
      </main>

      <div id="driveLock" class="drive-lock hidden" role="alertdialog" aria-modal="true">
        <div class="drive-lock-panel">
          <h2>走行中の操作を停止しています</h2>
          <p>安全な場所で完全に停車してから操作してください。</p>
          <span id="lockSpeed">速度確認中</span>
        </div>
      </div>
    </div>

    <script src="/config.js?v=1"></script>
    <script type="module" src="/app.js?v=9"></script>
  </body>
</html>
